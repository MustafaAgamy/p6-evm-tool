name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog for this version
        id: changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"

          # 1. Extract the human-written block from CHANGELOG.md
          NOTES=$(awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for details."
          fi

          # 2. Build commit list since the previous tag, excluding changelog bumps
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
          else
            RANGE="${TAG}"
          fi
          COMMITS=$(git log "$RANGE" --no-merges \
            --pretty="format:* %s ([%h](https://github.com/${REPO}/commit/%H))" \
            | grep -v "^\* chore: bump changelog")

          # 3. Combine
          if [ -n "$COMMITS" ]; then
            NOTES=$(printf '%s\n\n## Commits\n%s' "$NOTES" "$COMMITS")
          fi

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller playwright
          pip install -r requirements.txt
          playwright install chromium

      # The app shows the version read from the newest "## [vX.Y.Z]" heading of CHANGELOG.md
      # (utils.APP_VERSION). Stop before building when that heading is missing or does not
      # match the tag being released — the exe would otherwise say the wrong version.
      - name: Check the version (CHANGELOG = tag = app)
        shell: bash
        run: |
          pip install pytest
          python -m pytest tests/test_app_version.py -q -p no:cacheprovider
          APPV=$(python -c "import utils; print(utils.APP_VERSION)" | tr -d '\r')
          echo "Version from CHANGELOG.md: v${APPV}"
          if [[ "${GITHUB_REF}" == refs/tags/v* && "v${APPV}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} but the newest CHANGELOG.md release is v${APPV} - add the '## [${GITHUB_REF_NAME}] - date' section to CHANGELOG.md first."
            exit 1
          fi

      - name: Build exe
        run: pyinstaller controlyx.spec

      - name: Upload build artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Controlyx-${{ github.run_number }}
          path: dist/Controlyx.exe
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: dist/Controlyx.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

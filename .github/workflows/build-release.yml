name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"

          # 1. Extract the human-written block from CHANGELOG.md
          NOTES=$(awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for details."
          fi

          # 2. Build commit list since the previous tag, excluding changelog bumps
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
          else
            RANGE="${TAG}"
          fi
          COMMITS=$(git log "$RANGE" --no-merges \
            --pretty="format:* %s ([%h](https://github.com/${REPO}/commit/%H))" \
            | grep -v "^\* chore: bump changelog")

          # 3. Combine
          if [ -n "$COMMITS" ]; then
            NOTES=$(printf '%s\n\n## Commits\n%s' "$NOTES" "$COMMITS")
          fi

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller playwright
          pip install -r requirements.txt
          playwright install chromium

      - name: Build exe
        run: pyinstaller p6evm.spec

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: dist/P6EVMTool.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

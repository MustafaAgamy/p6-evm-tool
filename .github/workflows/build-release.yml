name: Build & Release

# Three ways in:
#   • push to master that touches the changelog / version → if the newest `## [vX.Y.Z]`
#     heading in CHANGELOG.md has no tag yet, tag it, build the exe and publish the Release
#     (automatic releases: add the changelog section — utils.APP_VERSION is read from it —
#     merge to master, done)
#   • push of a v* tag → build + Release for that tag (manual tagging still works)
#   • workflow_dispatch → build only; the exe is uploaded as a run artifact, no Release
on:
  push:
    branches:
      - master
    paths:
      - 'CHANGELOG.md'
      - 'utils.py'
      - '.github/workflows/build-release.yml'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide what to build / release
        id: decide
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "Tag push ${GITHUB_REF_NAME} → build + release"
            { echo "build=true"; echo "release=true"; echo "tag=${GITHUB_REF_NAME}"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "Manual run → build only (artifact, no Release)"
            { echo "build=true"; echo "release=false"; echo "tag="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Push to master: release the newest changelog version if it isn't tagged yet.
          VERSION=$(grep -m1 -oP '^## \[v\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md || true)
          if [ -z "$VERSION" ]; then
            echo "No ## [vX.Y.Z] heading in CHANGELOG.md → nothing to release"
            { echo "build=false"; echo "release=false"; echo "tag="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} is already tagged → nothing to release"
            { echo "build=false"; echo "release=false"; echo "tag=${TAG}"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Guard: the version shown in the app must match the release being published.
          # utils.APP_VERSION is read from the newest CHANGELOG heading (utils.release_version),
          # so ask Python for the value the app will show rather than grep a literal.
          APP_VERSION=$(python3 -c "import utils; print(utils.APP_VERSION)" | tr -d '\r' || true)
          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "::error::CHANGELOG.md's newest release is ${TAG} but utils.APP_VERSION is '${APP_VERSION}' — the app must show the changelog's version"
            exit 1
          fi

          echo "New changelog version ${TAG} on master → tag, build + release"
          { echo "build=true"; echo "release=true"; echo "tag=${TAG}"; } >> "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog for this version
        id: changelog
        if: needs.decide.outputs.release == 'true'
        shell: bash
        env:
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          REPO="${{ github.repository }}"

          # 1. Extract the human-written block from CHANGELOG.md
          NOTES=$(awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for details."
          fi

          # 2. Build commit list since the previous tag, excluding changelog bumps.
          #    HEAD is the commit being released (the tag itself may not exist yet).
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1 || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          COMMITS=$(git log "$RANGE" --no-merges \
            --pretty="format:* %s ([%h](https://github.com/${REPO}/commit/%H))" \
            | grep -v "^\* chore: bump changelog" || true)

          # 3. Combine
          if [ -n "$COMMITS" ]; then
            NOTES=$(printf '%s\n\n## Commits\n%s' "$NOTES" "$COMMITS")
          fi

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller playwright
          pip install -r requirements.txt
          playwright install chromium

      # The app shows the version read from the newest "## [vX.Y.Z]" heading of CHANGELOG.md
      # (utils.APP_VERSION). Stop before building when that heading is missing or does not
      # match the tag being released — the exe would otherwise say the wrong version.
      - name: Check the version (CHANGELOG = tag = app)
        shell: bash
        env:
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          pip install pytest
          python -m pytest tests/test_app_version.py -q -p no:cacheprovider
          APPV=$(python -c "import utils; print(utils.APP_VERSION)" | tr -d '\r')
          echo "Version from CHANGELOG.md: v${APPV}"
          if [[ -n "${TAG}" && "v${APPV}" != "${TAG}" ]]; then
            echo "::error::Releasing ${TAG} but the newest CHANGELOG.md release is v${APPV} - add the '## [${TAG}] - date' section to CHANGELOG.md first."
            exit 1
          fi

      - name: Build exe
        run: pyinstaller controlyx.spec

      - name: Upload build artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Controlyx-${{ github.run_number }}
          path: dist/Controlyx.exe
          retention-days: 14

      - name: Create GitHub Release
        if: needs.decide.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.decide.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.changelog.outputs.notes }}
          files: dist/Controlyx.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>P6 EVM Tool</title>
  <link rel="stylesheet" href="/ui/style.css">
  <script>(function(){var t=localStorage.getItem('p6_evm_theme')||'light';if(t==='light')document.documentElement.classList.add('light');}());</script>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sb-logo">P</div>
    <nav class="sb-nav">
      <button class="sb-item active" id="sb-home-btn" title="Home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </button>
      <button class="sb-item" id="sb-audit-btn" title="Schedule Audit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </button>
      <button class="sb-item disabled" title="Reports (coming soon)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
      </button>
      <button class="sb-item disabled" title="Settings (coming soon)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
    </nav>
    <div class="sb-avatar"></div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <div class="tb-left">
        <span class="tb-title">P6 EVM Tool</span>
        <span class="tb-sub" id="topbar-sub">Home · Import</span>
      </div>
      <div class="tb-right">
        <button class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
          <!-- Moon: shown in dark mode -->
          <svg class="theme-icon icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <!-- Sun: shown in light mode -->
          <svg class="theme-icon icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <div class="tb-avatar"></div>
      </div>
    </header>

    <main class="content" id="drop-target">

      <!-- Import section -->
      <section class="import-section">
        <div class="section-label">Import Schedule</div>
        <div class="import-cards">

          <div class="import-card">
            <div class="card-icon" style="background:#22c55e">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
              </svg>
            </div>
            <div class="card-name">Import XML</div>
            <div class="card-sub">P6 XML Export</div>
            <button class="card-btn" id="browse-btn">Browse File</button>
            <div class="spinner hidden" id="browse-spinner"></div>
          </div>

          <div class="import-card">
            <div class="card-icon" style="background:#0ea5e9">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
              </svg>
            </div>
            <div class="card-name">Import XER</div>
            <div class="card-sub">P6 XER Export</div>
            <button class="card-btn" id="xer-btn">Browse File</button>
            <div class="spinner hidden" id="xer-spinner"></div>
          </div>

          <div class="import-card disabled">
            <div class="card-icon" style="background:#475569">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M3 9h18M9 21V9"/>
              </svg>
            </div>
            <div class="card-name">Import Excel</div>
            <div class="card-sub">Coming soon</div>
          </div>

        </div>
        <div class="drop-strip" id="drop-strip">
          📎 Drag &amp; drop your P6 XML or XER file anywhere to import
        </div>
      </section>

      <!-- Error banner -->
      <div class="error-banner hidden" id="error-banner">
        <span id="error-text"></span>
        <button class="error-close" id="error-close">✕</button>
      </div>

      <!-- Results section (hidden until a file is parsed) -->
      <section class="results-section hidden" id="results-section">
        <div class="file-info-bar" id="file-info-bar"></div>

        <!-- Choose which analysis to view (EVM is not auto-generated) -->
        <div class="analysis-chooser" id="analysis-chooser">
          <div class="section-label">Choose what to view for this schedule</div>
          <div class="chooser-cards">
            <button class="chooser-card" data-view="evm">
              <div class="cc-icon evm">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
              </div>
              <div class="cc-title">EVM Results</div>
              <div class="cc-sub">Planned vs Earned Value, SPI, CPI, Finish Delay, category progress</div>
            </button>
            <button class="chooser-card" data-view="audit">
              <div class="cc-icon audit">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>
                </svg>
              </div>
              <div class="cc-title">Schedule Audit</div>
              <div class="cc-sub">Dangling Activities &amp; Float Analysis — isolated module reports</div>
            </button>
            <button class="chooser-card" data-view="oos">
              <div class="cc-icon oos">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 12h5l3-8 4 16 3-8h3"/>
                </svg>
              </div>
              <div class="cc-title">Out of Sequence</div>
              <div class="cc-sub">Activities progressing ahead of their logic — consultant review report</div>
            </button>
            <button class="chooser-card" data-view="calendar">
              <div class="cc-icon calendar">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
              </div>
              <div class="cc-title">Calendar Audit</div>
              <div class="cc-sub">Project calendar timeline, holidays, shutdowns, working-hour changes</div>
            </button>
            <button class="chooser-card" data-view="construct">
              <div class="cc-icon" style="background:linear-gradient(135deg,#0d9488,#14b8a6)">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/>
                </svg>
              </div>
              <div class="cc-title">Constructability Review</div>
              <div class="cc-sub">Rule + knowledge-base check — illogical logic, missing activities &amp; WBS, with a score · offline</div>
            </button>
            <button class="chooser-card" data-view="compare">
              <div class="cc-icon" style="background:#8b5cf6">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M7 8l-4 4 4 4"/><path d="M17 8l4 4-4 4"/><line x1="14" y1="4" x2="10" y2="20"/>
                </svg>
              </div>
              <div class="cc-title">Consultant Review</div>
              <div class="cc-sub">Baseline vs current update — driving logic, lag &amp; duration changes and the right delay</div>
            </button>
            <button class="chooser-card" data-view="lag">
              <div class="cc-icon" style="background:#0ea5e9">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h11l5 5v11a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1z"/><path d="M8 12h8M8 16h8M8 8h4"/>
                </svg>
              </div>
              <div class="cc-title">Lag Report</div>
              <div class="cc-sub">Every relationship lag &amp; lead, with a justification column — charts, register, PDF &amp; Excel</div>
            </button>
            <button class="chooser-card" data-view="period">
              <div class="cc-icon" style="background:#14b8a6">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/>
                </svg>
              </div>
              <div class="cc-title">Update vs Update</div>
              <div class="cc-sub">This period vs last — progress movement, critical-path slip, milestone trend</div>
            </button>
            <button class="chooser-card" data-view="critpath">
              <div class="cc-icon" style="background:#dc2626">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 20V4"/><path d="M4 8h6l4 6h6"/><circle cx="20" cy="14" r="1.6" fill="currentColor"/>
                </svg>
              </div>
              <div class="cc-title">Critical Path Analyzer</div>
              <div class="cc-sub">Compare the critical path across updates &amp; baseline — reroute, CPLI, near-critical</div>
            </button>
          </div>
        </div>

        <div id="analysis-views" class="hidden">
        <div class="view-tabs">
          <button class="view-tab active" id="tab-evm" data-view="evm">EVM Results</button>
          <button class="view-tab" id="tab-audit" data-view="audit">Schedule Audit</button>
          <button class="view-tab" id="tab-oos" data-view="oos">Out of Sequence</button>
          <button class="view-tab" id="tab-calendar" data-view="calendar">📅 Calendar Audit</button>
          <button class="view-tab" id="tab-construct" data-view="construct">🧠 Constructability</button>
          <button class="view-tab" id="tab-compare" data-view="compare">Consultant Review</button>
          <button class="view-tab" id="tab-lag" data-view="lag">Lag Report</button>
          <button class="view-tab" id="tab-period" data-view="period">Update vs Update</button>
          <button class="view-tab" id="tab-critpath" data-view="critpath">Critical Path Analyzer</button>
          <button class="view-change" id="btn-change-analysis" title="Back to analysis choice">⟲ Change</button>
        </div>

        <div class="view-panel" id="evm-panel">
          <div id="evm-body"></div>
          <div class="action-buttons">
            <button class="btn-secondary" id="load-another-btn">Load Another File</button>
            <button class="btn-primary" id="pdf-btn">Generate EVM PDF</button>
          </div>
        </div>

        <div class="view-panel hidden" id="audit-panel">
          <div class="module-tabs" id="module-tabs"></div>
          <div id="audit-body">
            <div id="module-body"></div>
          </div>
          <div class="action-buttons">
            <button class="btn-secondary" id="excel-btn">Export Module to Excel</button>
            <button class="btn-primary" id="pdf-btn-audit">Generate Module PDF</button>
          </div>
        </div>

        <div class="view-panel hidden" id="oos-panel">
          <div id="oos-body"></div>
          <div class="action-buttons">
            <button class="btn-secondary" id="oos-excel-btn">Export to Excel</button>
            <button class="btn-primary" id="oos-pdf-btn">Generate PDF</button>
          </div>
        </div>

        <div class="view-panel hidden" id="calendar-panel">
          <div id="calendar-body"></div>
          <div class="action-buttons">
            <button class="btn-secondary" id="cal-excel-btn">Export to Excel</button>
            <button class="btn-primary" id="cal-pdf-btn">Generate Calendar Audit PDF</button>
          </div>
        </div>

        <div class="view-panel hidden" id="construct-panel">
          <div id="construct-body"></div>
        </div>

        <div class="view-panel hidden" id="compare-panel">
          <div id="compare-body"></div>
        </div>

        <div class="view-panel hidden" id="lag-panel">
          <div id="lag-body"></div>
          <div class="action-buttons">
            <button class="btn-secondary" id="lag-excel-btn">Export to Excel</button>
            <button class="btn-primary" id="lag-pdf-btn">Generate Lag Report PDF</button>
          </div>
        </div>

        <div class="view-panel hidden" id="period-panel">
          <div id="period-body"></div>
        </div>

        <div class="view-panel hidden" id="critpath-panel">
          <div id="critpath-body"></div>
        </div>
        </div><!-- /analysis-views -->
      </section>

      <!-- Recent projects -->
      <section class="recent-section">
        <div class="section-label">Recent Projects</div>
        <div class="recent-table-wrap">
          <table class="recent-table">
            <thead>
              <tr>
                <th>Project / File</th>
                <th>Data Date</th>
                <th>Delay</th>
                <th>SPI</th>
                <th>Progress</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="recent-tbody"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>
</div>
<div id="g-tooltip"></div>
<script type="module" src="/ui/app.js"></script>
</body>
</html>

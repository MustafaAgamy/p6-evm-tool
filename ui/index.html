<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>P6 EVM Tool</title>
  <link rel="stylesheet" href="/ui/style.css">
  <script>(function(){var t=localStorage.getItem('p6_evm_theme')||'light';if(t==='light')document.documentElement.classList.add('light');}());</script>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sb-logo">P</div>
    <nav class="sb-nav">
      <button class="sb-item active" id="sb-home-btn" title="Home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </button>
      <button class="sb-item disabled" title="Reports (coming soon)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
      </button>
      <button class="sb-item disabled" title="Settings (coming soon)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
    </nav>
    <div class="sb-avatar"></div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <div class="tb-left">
        <span class="tb-title">P6 EVM Tool</span>
        <span class="tb-sub" id="topbar-sub">Home · Import</span>
      </div>
      <div class="tb-right">
        <button class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
          <!-- Moon: shown in dark mode -->
          <svg class="theme-icon icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <!-- Sun: shown in light mode -->
          <svg class="theme-icon icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <div class="tb-avatar"></div>
      </div>
    </header>

    <main class="content" id="drop-target">

      <!-- Import section -->
      <section class="import-section">
        <div class="section-label">Import Schedule</div>
        <div class="import-cards">

          <div class="import-card">
            <div class="card-icon" style="background:#22c55e">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
              </svg>
            </div>
            <div class="card-name">Import XML</div>
            <div class="card-sub">P6 XML Export</div>
            <button class="card-btn" id="browse-btn">Browse File</button>
            <div class="spinner hidden" id="browse-spinner"></div>
          </div>

          <div class="import-card" id="xer-btn">
            <div class="card-icon" style="background:#0ea5e9">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
              </svg>
            </div>
            <div class="card-name">Import XER</div>
            <div class="card-sub">Primavera P6 XER export</div>
          </div>

          <div class="import-card disabled">
            <div class="card-icon" style="background:#475569">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M3 9h18M9 21V9"/>
              </svg>
            </div>
            <div class="card-name">Import Excel</div>
            <div class="card-sub">Coming soon</div>
          </div>

        </div>
        <div class="drop-strip" id="drop-strip">
          📎 Drag &amp; drop your P6 XML or XER file anywhere to import
        </div>
      </section>

      <!-- Error banner -->
      <div class="error-banner hidden" id="error-banner">
        <span id="error-text"></span>
        <button class="error-close" id="error-close">✕</button>
      </div>

      <!-- Results section (hidden until a file is parsed) -->
      <section class="results-section hidden" id="results-section">
        <div class="file-info-bar" id="file-info-bar"></div>
        <div class="kpi-row" id="kpi-row"></div>
        <div class="category-progress" id="category-progress"></div>
        <div class="action-buttons">
          <button class="btn-secondary" id="load-another-btn">Load Another File</button>
          <button class="btn-primary" id="pdf-btn">Generate PDF Report</button>
        </div>
      </section>

      <!-- Recent projects -->
      <section class="recent-section">
        <div class="section-label">Recent Projects</div>
        <div class="recent-table-wrap">
          <table class="recent-table">
            <thead>
              <tr>
                <th>Project / File</th>
                <th>Data Date</th>
                <th>Delay</th>
                <th>SPI</th>
                <th>Progress</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="recent-tbody"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>
</div>
<div id="g-tooltip"></div>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
